# =============================================================================
# ssc-demo platform app-of-apps.
#
# Installs the demo platform on a cluster that already has OpenShift GitOps
# running. Everything below is reproduced from the reference cluster
# (cluster-6jnws), which is built from redhat-ads-tech/ocp-app-platform-demo-helm
# v1.4.2 plus the Red Hat RHTPA chart -- see each component's README for what
# was changed and why.
#
# NOT managed here: Artifactory. It lives in automation/gitops/artifactory as a
# standalone Application with its own runbook, and it is already working.
#
# Sync-wave order (an Application's wave only advances once the previous wave is
# Healthy, so this is a real dependency chain):
#
#    0  pipelines                OpenShift Pipelines operator -- CRDs everything else's
#                                tasks need; nothing depends on it at install time, so
#                                it goes first and gets out of the way.
#    5  keycloak                 The IdP. RHTAS and RHTPA both authenticate against its
#                                `backstage` realm, so it must be serving
#                                /.well-known/openid-configuration before either starts.
#    8  gitlab                   Independent of Keycloak (root auth, not OIDC), but slow:
#                                the seeding job imports a repository from GitHub. Started
#                                early so it overlaps the operator installs.
#   10  quay                     The application image registry. Needs the pipeline
#                                namespace and its `pipeline` ServiceAccount (wave 3-5) to
#                                exist before it can write the push Secret, and NooBaa in
#                                openshift-storage for its object storage.
#   10  rhtas                    Securesign. Needs the realm's trusted-artifact-signer client.
#   10  rhtpa-prerequisites      Postgres + oidc-tpa-cli Secret + the S3 bucket. Its PreSync
#                                hook blocks on the Keycloak issuer, which is the real
#                                reason keycloak is a lower wave.
#   15  rhtpa-operator           The analyzer itself, via the RHTPA operator
#                                (TrustedProfileAnalyzer, rhtpa.io/v1). The
#                                charts.openshift.io Helm path was removed: only
#                                the operator supports Exploit Intelligence.
#   16  app-environments          The example application's dev/qa/prod environments
#                                -- the consumer end of the CD chain. Each tracks
#                                the gitops repository the GitLab seeding job
#                                imports; every promotion merged there rolls the
#                                matching deployment. Last on purpose: see the
#                                component below.
#
# BEFORE INSTALLING: set deployer.domain and replace every REPLACE_ME in
# `credentials` below. Do that in a LOCAL values override that you do not
# commit (`helm template ... -f private.yaml`), not in this file.
# =============================================================================

deployer:
  # Apps subdomain of the target cluster, WITHOUT a leading dot, e.g.
  # apps.cluster-abcde.dyn.redhatworkshops.io. Every hostname the platform
  # publishes derives from this.
  #
  #   oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
  domain: ""
  apiUrl: ""

gitops:
  repoUrl: "https://github.com/machacekondra/ssc-demo.git"
  revision: "main"
  basePath: "automation/gitops"
  # The Tekton resources are NOT under basePath -- they live at the repo root,
  # where pipelines/README.md documents them. Argo applies them from there
  # rather than from a copy, so the two cannot drift.
  tektonPath: "pipelines"

argocd:
  namespace: openshift-gitops
  project: default

# Namespace the Tekton pipelines are installed into. The GitLab seeding job
# writes `scm-auth-secret` and `gitlab-webhook-secret` here and derives the
# issue-comment webhook URL from it.
pipelineNamespace: tssc-app-ci

# -----------------------------------------------------------------------------
# Credentials. All REPLACE_ME; supply real values at install time from an
# uncommitted override file. Generate them with e.g. `openssl rand -hex 16`.
# -----------------------------------------------------------------------------
credentials:
  # Keycloak's own Postgres.
  keycloakDbPassword: REPLACE_ME

  # GitLab root. The seeding job authenticates as root to create the group,
  # import the repository and mint the pipeline's project access token.
  gitlabRootPassword: REPLACE_ME

  # RHTPA's Postgres. Used by BOTH the prerequisites chart (which creates the
  # database) and the RHTPA chart (which connects to it) -- one value, two
  # consumers, so it is set once here.
  tpaDbPassword: REPLACE_ME

  # The Quay superuser. The seeding job creates this account through
  # /api/v1/user/initialize and then logs in as it to make the organization and
  # the pipeline robot, so it is also how you sign in to the Quay console.
  quayAdminPassword: REPLACE_ME

  # The `tpa-cli` OIDC client secret, and the single most load-bearing value in
  # this file. It is written into the Keycloak realm, into the `oidc-tpa-cli`
  # Secret RHTPA reads, and -- by hand, see step 5 of README.md -- into the
  # pipeline's `tpa-secret` as `oidc_client_secret`. If any of the three drift,
  # every RHTPA call returns 401 and nothing else looks wrong.
  tpaCliClientSecret: REPLACE_ME

# =============================================================================
# Components
# =============================================================================
components:

  pipelines:
    enabled: true
    namespace: openshift-operators
    syncWave: "0"

  # OpenShift Data Foundation. OPTIONAL, and OFF by default: the reference
  # cluster and most Red Hat workshop clusters already have it, and a second
  # StorageCluster is not something you can back out of cleanly.
  #
  # Turn it on only when `oc get storagecluster -A` is empty. Two components
  # below need the object storage it provides -- rhtpa's `s3` mode and quay's
  # managed `objectstorage`, both of which raise an ObjectBucketClaim against
  # `openshift-storage.noobaa.io`. The alternative is the filesystem/no-Quay
  # fallback described in README.md.
  #
  # Wave 0, with the Pipelines operator: it has to be Healthy before quay and
  # rhtpa-prerequisites at wave 10. Be aware of what that costs -- waves are
  # strictly ordered, so with the readiness gate on, keycloak and gitlab do not
  # start until Ceph is up, adding its 15-25 minutes to the front of the
  # install rather than overlapping it. Setting readinessGate: false lets the
  # rest proceed in parallel and bets that ODF beats wave 10, which it usually
  # does -- but when it loses, Quay and RHTPA fail against a NooBaa that has no
  # StorageClass yet, and that failure reads as a Quay bug.
  odf:
    enabled: false
    namespace: openshift-storage
    syncWave: "0"
    # MUST match the cluster's OpenShift minor version:
    #   oc -n openshift-marketplace get packagemanifest odf-operator \
    #     -o jsonpath='{.status.defaultChannel}{"\n"}'
    channel: stable-4.21
    # The BLOCK storage class Ceph carves OSDs from -- gp3-csi on AWS,
    # thin-csi on vSphere, an LSO class on bare metal. Not the class anything
    # else in the demo consumes.
    storageClassName: gp3-csi
    size: 512Gi
    replica: 3
    # lean | balanced | performance. lean, because this cluster also runs
    # GitLab, Quay, Keycloak, RHTPA, Artifactory and Tekton builds.
    resourceProfile: lean
    # Keeps the Application Progressing until the StorageCluster, NooBaa and
    # the openshift-storage.noobaa.io StorageClass are all up. See above.
    readinessGate: true

  # The Tekton layer itself: the Tasks, Pipelines, Triggers and ConfigMap that
  # pipelines/README.md otherwise has you `oc apply` by hand. Four Applications
  # rather than one, because each points at a single directory with
  # `recurse: false` -- that keeps every include/exclude pattern a bare
  # filename, which Argo matches the same way regardless of version, and it
  # makes a failure in (say) the triggers visible on its own.
  tekton:
    enabled: true
    syncWaves:
      # Operator CRDs come from wave 0. Tasks and the AI config have no
      # intra-layer dependencies; Pipelines reference Tasks; Triggers reference
      # Pipelines.
      tasks: "3"
      config: "3"
      pipelines: "4"
      triggers: "5"

    # pipelines/pipelines/ holds THREE files that all declare
    # `metadata.name: maven-build-ci`, and Argo CD refuses to sync a directory
    # containing two resources with the same identity ("appeared 2 times among
    # application resources"). Exactly one is installed; the other two are
    # excluded by filename.
    #
    #   maven-build-ci-pipeline-ai.yaml      build + sign + SBOM + AI scan chain
    #   maven-build-ci-pipeline.yaml         build + sign + SBOM + ACS gates
    #   maven-build-ci-pipeline-no-acs.yaml  as above, ACS gates removed
    #
    # The AI variant is the default because it is what the reference cluster
    # has applied and what the demo narrative exercises.
    mavenBuildPipeline: maven-build-ci-pipeline-ai.yaml

    # pipelines/config/rhtpa-enable-importers-job.yaml flips RHTPA's
    # `redhat-csaf` importer on through the REST API. The RHTPA Application
    # below already declares that importer with `disabled: false`, so on a
    # GitOps install the Job is redundant -- and it reads the hand-made
    # `tpa-secret`, so syncing it before step 5 of README.md just leaves a
    # failed Job. Turn it on only if you install RHTPA some other way.
    enableImportersJob: false

  keycloak:
    enabled: true
    namespace: keycloak
    syncWave: "5"
    # Baked into the OIDC issuer URL that RHTAS, RHTPA and the pipeline's
    # `oidc-issuer` parameter all carry. Renaming means changing all of them.
    #
    # Read even when `enabled: false` -- the issuer is computed at the top of
    # applications.yaml, outside the component guard, so the bring-your-own
    # path below still gets a correct issuer by setting this to the realm your
    # existing Keycloak actually serves.
    realm: backstage

  # Bring-your-own-Keycloak. Mutually exclusive with `keycloak` above: set
  # that one to `enabled: false`, set its `realm` to the realm you already
  # have, and turn this on.
  #
  # WHEN YOU NEED THIS: the cluster already runs a Keycloak you must not
  # replace. The case that matters is a cluster whose own OAuth is federated
  # to it -- deleting that Keycloak locks every user, including you, out of
  # the cluster. Check before deciding:
  #
  #   oc get oauth cluster -o jsonpath='{range .spec.identityProviders[*]}{.name}{" "}{.type}{"\n"}{end}'
  #   oc get user <you> -o jsonpath='{.identities}{"\n"}'
  #   oc -n kube-system get secret kubeadmin
  #
  # An OpenID provider plus no kubeadmin secret means the Keycloak is
  # load-bearing for cluster access. It is also why installing a second
  # Keycloak alongside does not work: applications.yaml derives the issuer
  # host as `sso.<domain>`, which that Keycloak's Route already holds.
  #
  # This installs no Keycloak. It runs a Job that adds only what ssc-demo
  # needs to the existing realm -- the tpa document scopes, the tpa-* roles,
  # and the tpa-cli / tpa-frontend / trusted-artifact-signer clients. It does
  # not touch existing clients, users or identity-provider config.
  keycloakClients:
    enabled: false
    # Must be the namespace holding the admin Secret: the Job mounts it, and
    # a pod cannot mount a Secret from another namespace.
    namespace: keycloak
    # Same wave as the keycloak component it replaces -- before rhtas and
    # rhtpa-prerequisites at wave 10, both of which authenticate against it.
    syncWave: "5"
    # Empty derives https://sso.<domain>.
    keycloakUrl: ""
    # The Keycloak operator generates this with username/password keys.
    adminSecretName: keycloak-initial-admin
    tlsVerify: true

  gitlab:
    enabled: true
    namespace: gitlab
    syncWave: "8"

  # The registry the demo's application images are published to. The pipelines
  # push `quay.<domain>/<organization>/<component>:<revision>`.
  #
  # Wave 10, alongside rhtas and rhtpa-prerequisites, so the three install in
  # parallel rather than adding their install times together. It cannot go
  # earlier: the seeding job writes the push Secret into the pipeline namespace
  # and links it to the `pipeline` ServiceAccount, and neither exists until the
  # Tekton Applications have run (waves 3-5).
  #
  # NEEDS ODF. `objectstorage` is a managed component, so the Quay operator
  # raises an ObjectBucketClaim against NooBaa in openshift-storage -- the same
  # dependency rhtpa's default s3 storage has. On a cluster without ODF, set
  # enabled: false here; the pipelines then need an `output-image` on some
  # other registry and a push secret you create yourself.
  quay:
    enabled: false
    namespace: quay-registry
    syncWave: "10"
    # Organization the images land in, and the robot account that pushes them.
    # Together they produce `quay.<domain>/tssc/<component>` and the Quay
    # account `tssc+remediation`, which is what the reference cluster uses.
    organization: tssc
    robotName: remediation
    # Name of the dockerconfigjson Secret written into pipelineNamespace and
    # linked to the `pipeline` ServiceAccount.
    pushSecretName: quay-push
    # NooBaa's namespace. Only read when objectStorageManaged is true.
    objectStorageManaged: true
    noobaaNamespace: openshift-storage

  rhtas:
    enabled: true
    namespace: trusted-artifact-signer
    syncWave: "10"

  rhtpaPrerequisites:
    enabled: true
    namespace: trusted-profile-analyzer
    syncWave: "10"

  # RHTPA 3.x via the operator. MUTUALLY EXCLUSIVE with `rhtpa` below -- both
  # publish the same Route and own the same Deployments, so bootstrap-infra
  # fails the render if both are on.
  #
  # Enable this INSTEAD OF `rhtpa` when you need Exploit Intelligence: it
  # integrates through `spec.exploitIntelligence` on the TrustedProfileAnalyzer
  # CR, which the charts.openshift.io Helm chart has no equivalent for.
  #
  # `rhtpaPrerequisites` stays enabled either way -- Postgres and the
  # oidc-tpa-cli Secret are shared. It creates the ObjectBucketClaim and
  # `trustify` Secret only in s3 mode. That is what keeps the switch a swap
  # rather than a rebuild.
  #
  # MIGRATING AN EXISTING INSTALL is not just a flag flip: Trustify 2.x -> 3.x
  # is a major version, and the operator's own migrateDatabase module runs
  # against the SAME Postgres the old release used. Take a database backup
  # first, and expect the Route to be briefly unavailable during the cutover.
  # RHTPA itself. The operator (TrustedProfileAnalyzer, rhtpa.io/v1) is now the
  # ONLY install path -- the charts.openshift.io Helm chart that used to live
  # at components.rhtpa has been removed. Exploit Intelligence integrates
  # through `spec.exploitIntelligence` on this CR and has no Helm-chart
  # equivalent, so keeping two paths meant keeping one that could never grow
  # the feature.
  #
  # `rhtpaPrerequisites` above stays separate and owns Postgres and the
  # oidc-tpa-cli Secret; it creates the S3 ObjectBucketClaim only in s3 mode.
  # It reads `storage.type` from HERE, so the two cannot disagree about
  # s3-vs-filesystem.
  rhtpaOperator:
    enabled: true
    namespace: trusted-profile-analyzer
    syncWave: "15"
    # stable-v3 is RHTPA 3.x, the first line Exploit Intelligence supports.
    channel: stable-v3
    # Set false if the namespace already has an OperatorGroup -- two in one
    # namespace puts every operator in it into an error state.
    createOperatorGroup: true
    # HAProxy's `timeout server` for the RHTPA Route. The default 30 s is not
    # survivable: /purl/recommend cannot complete inside it at any batch size.
    # The Route is GENERATED from an Ingress, so the annotation goes on the
    # Ingress via the CR's ingress.additionalAnnotations.
    routeTimeout: 300s
    tls:
      # Optional PEM CA bundle for outbound TLS, such as a self-signed
      # cluster ingress certificate used by Keycloak. Set in the private
      # values file rather than committing a cluster-specific certificate.
      additionalTrustAnchor: ""
    storage:
      # s3 (needs ODF) or filesystem. Filesystem storage uses a PVC of this
      # size; 50Gi is a small demo allocation with some headroom.
      type: filesystem
      size: 50Gi
      # Also read by rhtpaPrerequisites, which creates the ObjectBucketClaim
      # only in s3 mode.
      bucket: trustify
      # NooBaa's S3 endpoint. Empty derives
      # `https://s3-openshift-storage.<domain>:443`.
      regionEndpoint: ""

  # The example application's environments: the consumer end of the CD chain.
  # One Application per environment, each tracking the gitops repository the
  # GitLab seeding job imports (development/spring-boot-example-gitops on the
  # cluster's own GitLab) with its own values file -- so a promotion merged
  # there rolls exactly the matching deployment.
  #
  # Which promotions happen automatically is a PIPELINE policy, not an
  # Application one: gitops-cd-dev auto-merges dev only, and promoting to
  # qa/prod stays a human decision (an MR editing those values files, or a
  # pipeline run with environment=qa auto-merge=false). These Applications
  # just make sure every environment has a deployment waiting for its turn.
  #
  # Wave 16, AFTER everything else, deliberately. Each Application's health
  # includes the Deployment pulling its image, and on a fresh cluster the
  # imported values files' initial tags do not exist in Quay yet -- they
  # appear with the first ci-build-publish run and its promotions. An earlier
  # wave would leave the whole install waiting on (or blocked behind)
  # permanently Degraded Applications. Expect them to sit Degraded
  # (ImagePullBackOff) on a fresh cluster until promotions land; that is the
  # demo working as designed.
  #
  # MIGRATING A CLUSTER WHERE dev WAS CREATED BY HAND: nothing to delete. The
  # chart is installed with `helm template | oc apply` (RUNBOOK §5), and
  # `oc apply` simply adopts and updates the existing Application in place --
  # re-running the §5 command renders all three Applications and converges
  # dev onto the chart's sync policy while creating qa and prod.
  appEnvironments:
    enabled: true
    syncWave: "16"
    # The gitops repository the GitLab seeding job imports. Its host is
    # derived from the gitlab component's namespace and deployer.domain.
    gitGroup: development
    gitopsRepo: spring-boot-example-gitops
    revision: main
    chartPath: app/spring-boot-example
    environments:
      - name: dev
        namespace: spring-boot-example-dev
        valuesFile: environments/dev/values.yaml
      - name: qa
        namespace: spring-boot-example-qa
        valuesFile: environments/qa/values.yaml
      - name: prod
        namespace: spring-boot-example-prod
        valuesFile: environments/prod/values.yaml

