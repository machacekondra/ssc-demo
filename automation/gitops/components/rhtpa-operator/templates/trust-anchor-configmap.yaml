{{- if .Values.tls.additionalTrustAnchorPem }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhtpa-additional-trust-anchor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rhtpa-operator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  ca.crt: |
{{ .Values.tls.additionalTrustAnchorPem | indent 4 }}
{{- end }}
