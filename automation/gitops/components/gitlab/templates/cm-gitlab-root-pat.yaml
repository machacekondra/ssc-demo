kind: ConfigMap
metadata:
  name:  cm-create-root-pat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
apiVersion: v1
data:
  create-root-pat.sh: |
    #!/bin/bash
    set -e
    
    ./bin/rails runner "setting = ApplicationSetting.current; setting.default_projects_limit ||= 100; setting.restricted_visibility_levels ||= []; storages = Gitlab.config.repositories.storages.keys; weights = setting.repository_storages_weighted || {}; setting.repository_storages_weighted = storages.index_with { 100 } if (weights.keys & storages).empty?; setting.save! if setting.changed?; unless User.find_by(username: 'root'); require 'rake'; Rails.application.load_tasks; Rake::Task['db:seed_fu'].invoke; end; root = User.find_by!(username: 'root'); token = root.personal_access_tokens.create!(name: 'apitoken', impersonation: false, expires_at: 365.days.from_now, scopes: [:api]); File.open('/tmp/root.pat', 'w', 0600) { |file| file.write(token.token) }"
