apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-remediate-dependency
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, security, remediation, maven"
spec:
  description: >-
    Use an AI coding agent to update the selected vulnerable Maven dependency to
    its fixed version and confirm the project still resolves/compiles. Operates
    on the shared source workspace so the change accumulates alongside generated
    tests for a single PR. Backend pluggable via ai-agent-config / ai-agent-secret.
  params:
    - name: SUBDIRECTORY
      type: string
      default: source
    - name: CVE_ID
      type: string
    - name: PACKAGE
      type: string
      description: Maven coordinates (groupId:artifactId) to update.
    - name: CURRENT_VERSION
      type: string
      default: ""
    - name: FIXED_VERSION
      type: string
    - name: JUSTIFICATION
      type: string
      default: ""
    - name: AGENT_IMAGE
      type: string
      description: >-
        AI agent runtime image (JDK17 + Maven + the agent CLI). Use the flavor
        matching AI_AGENT: ai-agent-maven-claude for claude-code (default),
        ai-agent-maven-aider for aider.
      default: quay.io/REPLACE_ME/ai-agent-maven-claude:v1.0.0
  workspaces:
    - name: source
    - name: maven-settings
      optional: true
      description: >-
        Secret/ConfigMap holding a settings.xml that mirrors dependency
        resolution through the internal artifact repository. Optional so the
        task still runs without one, but a remediation that pins a Lightwell
        backport cannot build without it -- see the note in the step script.
  results:
    - name: CHANGED
      description: "1 if the agent modified the build files, else 0."
  stepTemplate:
    envFrom:
      - configMapRef:
          name: ai-agent-config
      - secretRef:
          name: ai-agent-secret
    env:
      - name: HOME
        value: /tekton/home
  steps:
    - name: remediate
      image: $(params.AGENT_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      volumeMounts:
        - name: agent-skills
          mountPath: /tekton/home/agent-skills/maven-remediation
          readOnly: true
      computeResources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
      env:
        - name: CVE_ID
          value: $(params.CVE_ID)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: CURRENT_VERSION
          value: $(params.CURRENT_VERSION)
        - name: FIXED_VERSION
          value: $(params.FIXED_VERSION)
        - name: JUSTIFICATION
          value: $(params.JUSTIFICATION)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        AGENT="${AI_AGENT:-claude-code}"
        MODEL="${AI_MODEL:-claude-opus-5}"
        echo "Remediating ${CVE_ID}: ${PACKAGE} -> ${FIXED_VERSION} (agent=${AGENT} model=${MODEL})"

        WORKDIR="$(workspaces.source.path)/$(params.SUBDIRECTORY)"

        # --- Point Maven at the internal mirror ------------------------------
        # EVERY mvn in this step has to resolve through the Artifactory virtual
        # repo rather than Central: the verification build below, and the
        # agent's own `Bash(mvn:*)` calls on the claude-code path. The whole
        # point of the remediation is a Lightwell backport coordinate such as
        # 6.0.3.rhlw-00001, which does NOT exist on Central -- with a default
        # settings.xml the build fails to resolve the very version the agent
        # just pinned ("Could not find artifact ... in central").
        #
        # Installed as ~/.m2/settings.xml rather than passed as `mvn -s` so that
        # one mechanism covers both callers; the agent's mvn invocations are
        # built by the agent and we cannot add flags to them.
        if [ "$(workspaces.maven-settings.bound)" = "true" ] \
           && [ -f "$(workspaces.maven-settings.path)/settings.xml" ]; then
          mkdir -p "${HOME}/.m2"
          cp "$(workspaces.maven-settings.path)/settings.xml" "${HOME}/.m2/settings.xml"
          echo "Maven resolution: using settings.xml from the maven-settings workspace."
        else
          echo "WARNING: no maven-settings workspace bound. Maven will resolve from" \
               "Central only, and a Lightwell .rhlw backport will NOT resolve."
        fi

        # The workspace repo was cloned by a different uid; this pod runs as an
        # arbitrary OpenShift uid, so git aborts with "detected dubious ownership".
        # Mark the repo safe for every git call here -- the agent's internal
        # `git add` and our own `git status` at the end.
        git config --global --add safe.directory "${WORKDIR}"
        git config --global --add safe.directory "$(workspaces.source.path)"
        git config --global user.email "pipeline@tekton.local" 2>/dev/null || true
        git config --global user.name "tekton-pipeline" 2>/dev/null || true

        # --- Remediation methodology skill ------------------------------------
        # Mounted read-only from the agent-skills-maven-remediation ConfigMap
        # (pipelines/config/, synced by ssc-tekton-config). The task prompt
        # below carries the WHAT (target package/version, no builds,
        # REMEDIATION.md); the skill carries the HOW (reading pom structure,
        # choosing the edit shape). Fail loudly if it is missing: aider --read
        # and claude --append-system-prompt would both silently continue with
        # no methodology at all.
        SKILL_DIR="${HOME}/agent-skills/maven-remediation"
        for f in SKILL.md pom-patterns.md; do
          if [ ! -f "${SKILL_DIR}/${f}" ]; then
            echo "ERROR: ${SKILL_DIR}/${f} is missing." \
                 "Is the agent-skills-maven-remediation ConfigMap applied" \
                 "(pipelines/config/agent-skills-maven-remediation.yaml)?"
            exit 1
          fi
        done

        PROMPT="Update the Maven dependency '${PACKAGE}' to version '${FIXED_VERSION}'
        to remediate ${CVE_ID}. Current version is '${CURRENT_VERSION}'. Follow the
        maven-remediation skill supplied as read-only context: read the pom.xml
        structure first, then apply the edit shape it prescribes (property value,
        BOM override property, inline version, or dependencyManagement entry).
        Apply EXACTLY version '${FIXED_VERSION}' -- never substitute another.
        Do NOT change unrelated dependencies or application logic. Do NOT run any
        build or shell commands -- the build is verified separately. Finally write a
        short REMEDIATION.md at the project root describing the change and this
        rationale: ${JUSTIFICATION}"

        # --- Dispatch to the configured coding agent ---
        case "${AGENT}" in
          aider)
            # OpenAI-compatible coding agent (gpt-oss, Granite, any vLLM/RHOAI/
            # Ollama/watsonx endpoint). litellm reads OPENAI_API_BASE/OPENAI_API_KEY.
            [ -n "${AI_BASE_URL:-}" ] && export OPENAI_API_BASE="${AI_BASE_URL}"
            export OPENAI_API_KEY="${OPENAI_API_KEY:-placeholder}"
            case "${MODEL}" in */*) AIDER_MODEL="${MODEL}";; *) AIDER_MODEL="openai/${MODEL}";; esac
            AIDER_MODEL_SETTINGS_ARGS=()
            if [ "${AIDER_MODEL}" = "openai/gpt-6-luna" ]; then
              mkdir -p "${HOME}"
              cat > "${HOME}/gpt-6-luna-aider-settings.yml" <<'YAML'
        - name: openai/gpt-6-luna
          use_temperature: false
        YAML
              AIDER_MODEL_SETTINGS_ARGS=(--model-settings-file "${HOME}/gpt-6-luna-aider-settings.yml")
            fi
            aider \
              "${AIDER_MODEL_SETTINGS_ARGS[@]}" \
              --model "${AIDER_MODEL}" \
              --yes-always --no-auto-commits --no-check-update --no-gitignore \
              --no-show-model-warnings \
              --read "${SKILL_DIR}/SKILL.md" \
              --read "${SKILL_DIR}/pom-patterns.md" \
              --message "${PROMPT}" \
              pom.xml 2>&1 | tee /tekton/home/aider-remediate.log
            ;;
          claude-code|*)
            case "${AI_PROVIDER:-anthropic}" in
              bedrock) export CLAUDE_CODE_USE_BEDROCK=1 ;;
              vertex)  export CLAUDE_CODE_USE_VERTEX=1 ;;
              gateway) export ANTHROPIC_BASE_URL="${AI_BASE_URL:?AI_BASE_URL required for gateway provider}" ;;
              anthropic|*) : ;;
            esac
            export ANTHROPIC_MODEL="${MODEL}"
            claude -p "${PROMPT}" \
              --model "${ANTHROPIC_MODEL}" \
              --append-system-prompt "$(cat "${SKILL_DIR}/SKILL.md" "${SKILL_DIR}/pom-patterns.md")" \
              --permission-mode acceptEdits \
              --allowedTools "Read,Write,Edit,Glob,Grep,Bash(mvn:*)" \
              --output-format json | tee /tekton/home/claude-remediate.json
            ;;
        esac

        # Verify compile independently of the agent's own run, in a pod-local copy.
        # target/ on the shared PVC was created by an earlier task pod under a
        # different uid, and Maven's resources plugin can't overwrite those
        # foreign-owned files ("Operation not permitted"). Exclude target/ (tar
        # re-owns to our uid on extract); the agent's pom.xml edit stays on the
        # shared workspace for open-pr to commit. --warning=no-file-changed +
        # tolerating tar's exit 1 handles a dir-mtime bump during the read.
        SCRATCH="/tekton/home/airemediate-work"
        rm -rf "${SCRATCH}"; mkdir -p "${SCRATCH}"
        set +e
        tar -C "${WORKDIR}" --exclude=./target --warning=no-file-changed -cf - . \
          | tar -C "${SCRATCH}" -xf -
        rcs=("${PIPESTATUS[@]}")
        set -e
        if [ "${rcs[0]}" -gt 1 ]; then echo "source tar failed (rc=${rcs[0]})"; exit 1; fi
        if [ "${rcs[1]}" -ne 0 ]; then echo "extract tar failed (rc=${rcs[1]})"; exit 1; fi
        # -e, not bare -q. `-q` prints the one-line "Plugin ... or one of its
        # dependencies could not be resolved" summary and swallows the cause, so a
        # resolution failure is undiagnosable from the TaskRun log -- one run died
        # on "Failed to read artifact descriptor for
        # org.eclipse.sisu:org.eclipse.sisu.plexus:jar:0.0.0.M5" with no reason
        # attached. `-q -e` keeps a successful build quiet but prints the full
        # exception chain when it fails.
        #
        # Retried once because this build resolves the whole plugin graph (~1500
        # artifacts) in one burst and a single failed descriptor read anywhere in
        # it fails everything. The retry adds -U to clear the *.lastUpdated markers
        # Maven writes for a failed resolution -- without it the second attempt
        # replays the cached failure instead of re-fetching.
        set +e
        ( cd "${SCRATCH}" && mvn -B -q -e -Dstyle.color=never -DskipTests install )
        mvn_rc=$?
        if [ "${mvn_rc}" -ne 0 ]; then
          echo "Verification build failed (rc=${mvn_rc}); retrying once with -U in case" \
               "the resolution failure was transient."
          ( cd "${SCRATCH}" && mvn -B -q -e -U -Dstyle.color=never -DskipTests install )
          mvn_rc=$?
        fi
        set -e
        [ "${mvn_rc}" -eq 0 ] || exit "${mvn_rc}"

        CHANGED="$(git -C "${WORKDIR}" status --porcelain -- pom.xml '**/pom.xml' 2>/dev/null | wc -l | tr -d ' ')"
        printf '%s' "$([ "${CHANGED:-0}" -gt 0 ] && echo 1 || echo 0)" > "$(results.CHANGED.path)"
        echo "Build file changes: ${CHANGED:-0}"
  # The remediation methodology skill (SKILL.md + pom-patterns.md), mounted
  # read-only at ${HOME}/agent-skills/maven-remediation. Lives in
  # pipelines/config/agent-skills-maven-remediation.yaml so it ships with the
  # rest of the Tekton config and no image change is needed.
  volumes:
    - name: agent-skills
      configMap:
        name: agent-skills-maven-remediation
