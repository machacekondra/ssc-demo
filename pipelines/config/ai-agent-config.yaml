# -----------------------------------------------------------------------------
# Pluggable AI backend configuration (non-secret).
#
# Every AI task in this pipeline reads its backend settings from this ConfigMap
# via `envFrom`, so you can point the whole pipeline at a different LLM backend
# by editing ONLY this file (and the companion Secret ai-agent-secret) -- no
# pipeline or task edits required.
#
# There are two independent switches:
#
# AI_PROVIDER -- the wire protocol / hosting for the *reasoning* call
#                (ai-select-cve) and for Claude Code auth:
#   anthropic  -> first-party Anthropic API   (Secret: ANTHROPIC_API_KEY)
#   gateway    -> any Claude-compatible gateway/proxy (e.g. LiteLLM, an
#                 on-cluster relay). Set AI_BASE_URL; auth via
#                 ANTHROPIC_AUTH_TOKEN in the Secret.
#   bedrock    -> Amazon Bedrock             (Secret: AWS_* creds; set AWS_REGION)
#   vertex     -> Google Vertex AI           (Secret: GCP creds; set VERTEX_*)
#   openai     -> any OpenAI-compatible endpoint: OpenAI, vLLM, Red Hat OpenShift
#                 AI, Ollama, or watsonx.ai (openai-compat). This is how you run
#                 open-weight models such as gpt-oss and IBM Granite. Set
#                 AI_BASE_URL to the /v1 endpoint; auth via OPENAI_API_KEY in the
#                 Secret (use any placeholder for servers that don't check it).
#
# AI_AGENT -- which coding-agent CLI drives the file-editing tasks
#             (ai-generate-tests, ai-remediate-dependency):
#   claude-code -> Claude Code headless (Anthropic protocol only). Use with
#                  AI_PROVIDER anthropic|gateway|bedrock|vertex.
#   aider       -> aider (litellm-backed) for OpenAI-compatible models. Use with
#                  AI_PROVIDER=openai to run gpt-oss / Granite / any vLLM/Ollama/
#                  watsonx model.
#
# Model examples:
#   Claude   : AI_PROVIDER=anthropic AI_AGENT=claude-code AI_MODEL=claude-opus-5
#   gpt-oss  : AI_PROVIDER=openai    AI_AGENT=aider        AI_MODEL=gpt-oss-120b
#              AI_BASE_URL=http://vllm-gpt-oss.my-ns.svc:8000/v1
#   Granite  : AI_PROVIDER=openai    AI_AGENT=aider        AI_MODEL=granite-3.3-8b-instruct
#              AI_BASE_URL=http://granite.my-ns.svc:8000/v1
# For aider, AI_MODEL may be a bare id (defaults to the "openai/" litellm
# provider) or a full litellm string, e.g. "ollama_chat/granite3.3:8b" or
# "watsonx/ibm/granite-3-8b-instruct" -- in which case add that provider's own
# env (OLLAMA_API_BASE, WATSONX_URL, ...) as extra keys here; envFrom passes them
# through automatically.
#
# To plug in a NON-listed implementation, build an image that honours the task
# contract in README-ai-remediation.md and set AGENT_IMAGE / AI_PYTHON_IMAGE on
# the PipelineRun -- this ConfigMap stays the single config surface.
#
# TLS trust for private endpoints and TLS-inspecting egress proxies
# -----------------------------------
# The OpenAI/Anthropic SDKs need the CA bundle passed to their HTTP client.
# OpenShift Pipelines mounts its cluster trust bundle at
# /tekton-custom-certs/ca-bundle.crt; point AI_CA_BUNDLE there when egress TLS
# is intercepted. For a different private CA, create ai-endpoint-ca with
# ca-bundle.crt and set AI_CA_BUNDLE to /etc/ai-ca/ca-bundle.crt instead.
#   * Disable verification (AI_TLS_INSECURE, demo/dev ONLY -- never production).
# aider/litellm reach the endpoint differently: they honor SSL_VERIFY, so for the
# aider tasks add SSL_VERIFY (a CA path, or "False" for demo-insecure) as an extra
# key here; envFrom passes it through. Plaintext in-cluster HTTP (http://...svc)
# sidesteps TLS entirely and needs none of this.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  labels:
    app.kubernetes.io/part-of: maven-build-ci
data:
  # Direct OpenAI API, driven by aider. Matches the `agent-image` default on
  # the pipelines (ai-agent-maven-aider), so no PipelineRun override is needed.
  #
  # The companion Secret must supply OPENAI_API_KEY and must NOT define
  # AI_PROVIDER: the AI tasks set
  #   envFrom: [configMapRef: ai-agent-config, secretRef: ai-agent-secret]
  # and the LAST source wins, so an AI_PROVIDER key in the Secret silently
  # overrides whatever is set here.
  AI_PROVIDER: "openai"
  AI_AGENT: "aider"
  AI_MODEL: "gpt-6-luna"
  # Direct OpenAI API endpoint. The companion Secret must contain an OpenAI API key.
  AI_BASE_URL: "https://api.openai.com/v1"
  # Effort / verbosity knob where supported (low|medium|high|xhigh|max).
  AI_EFFORT: "high"
  # Keep verification enabled and trust the cluster's injected egress CA bundle.
  AI_TLS_INSECURE: "false"
  # Tekton mounts this ConfigMap at /tekton-custom-certs in each TaskRun pod.
  AI_CA_BUNDLE: "/tekton-custom-certs/ca-bundle.crt"
  # aider/litellm use SSL_VERIFY for custom trust instead of AI_CA_BUNDLE.
  SSL_VERIFY: "/tekton-custom-certs/ca-bundle.crt"
  # AWS_REGION / VERTEX_PROJECT_ID / VERTEX_REGION are intentionally absent:
  # they apply only to AI_PROVIDER=bedrock|vertex. Re-add them (see the header)
  # if you switch provider.
