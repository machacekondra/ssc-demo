spec:
  params:
    - name: git-url
    - name: git-host
    - name: base-branch
      default: main
    - name: scm-provider
      default: gitlab
    - name: subdirectory
      default: source
    - name: issue-iid
      default: ""
    # Workspace backing -- override to match your cluster's storage/config.
    - name: workspace-size
      default: 2Gi
    - name: scm-secret-name
      default: scm-auth-secret
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: agentic-test-generation-integration-issue-
        labels:
          app.kubernetes.io/part-of: maven-build-ci
          tekton.dev/pipeline: agentic-test-generation-integration
          trigger: gitlab-issue
      spec:
        pipelineRef:
          name: agentic-test-generation-integration
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-host
            value: $(tt.params.git-host)
          - name: base-branch
            value: $(tt.params.base-branch)
          - name: scm-provider
            value: $(tt.params.scm-provider)
          - name: subdirectory
            value: $(tt.params.subdirectory)
          - name: scm-secret-name
            value: $(tt.params.scm-secret-name)
          - name: issue-iid
            value: $(tt.params.issue-iid)
        workspaces:
          - name: workspace
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: $(tt.params.workspace-size)
          # maven-settings: the integration task's agent adds TEST-SCOPED deps
          # (WireMock, Awaitility) that must resolve through the mirror, and it
          # runs Maven itself (verification builds). Same reasoning and same
          # `oc create secret` command as the templates above. The Secret MUST
          # exist in this namespace or the pod hangs in PodInitializing.
          - name: maven-settings
            secret:
              secretName: maven-settings
          # git-auth intentionally NOT bound -- same reasoning as the remediation
          # template above (optional workspace; a missing secret hangs the clone
          # pod). For a PRIVATE repo, create a `git-auth` Secret and add it back.
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: agentic-issue-commands
  labels:
    app.kubernetes.io/part-of: maven-build-ci
spec:
  serviceAccountName: tekton-triggers-sa
  triggers:
    - name: gitlab-issue-remediate
      interceptors:
        # 1) Validate the shared secret token and that this is a comment event.
        - ref:
            name: gitlab
          params:
            - name: secretRef
              value:
                secretName: gitlab-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value:
                - "Note Hook"
        # 2) Only act on issue comments beginning with /remediate.
        #
        # Two cel-interceptor gotchas shape the structure below:
        #
        #  (1) Overlays within a SINGLE cel interceptor do NOT chain -- they are all
        #      evaluated against the same starting extensions (empty), so an overlay
        #      cannot read an extension set by a sibling ("no such key"). Extensions
        #      only become visible to the NEXT interceptor. So the decision merge is
        #      split into three sequential cel interceptors by dependency:
        #        (a) raw text  ->  (b) parsed maps  ->  (c) merged fields.
        #
        #  (2) The overlay `key` is relative to the extensions root already, so it
        #      must be BARE (key: issueRaw), NOT prefixed (key: extensions.issueRaw).
        #      A prefixed key double-nests to extensions.extensions.issueRaw, which
        #      the next stage's `extensions.issueRaw` then can't find. Expressions
        #      and TriggerBinding refs, by contrast, DO use the extensions. prefix.
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.object_attributes.noteable_type == 'Issue' &&
                body.object_attributes.system == false &&
                body.object_attributes.note.matches('^/remediate(\\s|$)')
            - name: overlays
              value:
                # Raw decision text from the issue body's <!-- cve-decision ... --> marker.
                - key: issueRaw
                  expression: >-
                    (has(body.issue) && has(body.issue.description) && body.issue.description != null && size(body.issue.description.split("<!-- cve-decision")) > 1) ? body.issue.description.split("<!-- cve-decision")[1].split("-->")[0] : ""
                # Raw override text from the comment (everything after /remediate).
                - key: commentRaw
                  expression: >-
                    size(body.object_attributes.note.split("/remediate")) > 1 ? body.object_attributes.note.split("/remediate")[1] : ""
        # (b) Parse both raw blocks into maps (parseYAML also accepts JSON). Skip
        #     parsing when there's no "key: value" content, to avoid errors on empty
        #     text. Reads extensions.issueRaw / commentRaw from the previous stage.
        - ref:
            name: cel
          params:
            - name: overlays
              value:
                - key: issueMap
                  expression: >-
                    extensions.issueRaw.contains(":") ? extensions.issueRaw.parseYAML() : {}
                - key: commentMap
                  expression: >-
                    extensions.commentRaw.contains(":") ? extensions.commentRaw.parseYAML() : {}
        # (c) Merge each field (comment > issue > default) and derive SCM coordinates.
        #     Reads extensions.issueMap / commentMap from the previous stage.
        - ref:
            name: cel
          params:
            - name: overlays
              value:
                - key: SELECTED
                  expression: >-
                    ("SELECTED" in extensions.commentMap) ? string(extensions.commentMap["SELECTED"]) : (("SELECTED" in extensions.issueMap) ? string(extensions.issueMap["SELECTED"]) : "1")
                - key: CVE_ID
                  expression: >-
                    ("CVE_ID" in extensions.commentMap) ? string(extensions.commentMap["CVE_ID"]) : (("CVE_ID" in extensions.issueMap) ? string(extensions.issueMap["CVE_ID"]) : "")
                - key: PACKAGE
                  expression: >-
                    ("PACKAGE" in extensions.commentMap) ? string(extensions.commentMap["PACKAGE"]) : (("PACKAGE" in extensions.issueMap) ? string(extensions.issueMap["PACKAGE"]) : "")
                - key: CURRENT_VERSION
                  expression: >-
                    ("CURRENT_VERSION" in extensions.commentMap) ? string(extensions.commentMap["CURRENT_VERSION"]) : (("CURRENT_VERSION" in extensions.issueMap) ? string(extensions.issueMap["CURRENT_VERSION"]) : "")
                - key: FIXED_VERSION
                  expression: >-
                    ("FIXED_VERSION" in extensions.commentMap) ? string(extensions.commentMap["FIXED_VERSION"]) : (("FIXED_VERSION" in extensions.issueMap) ? string(extensions.issueMap["FIXED_VERSION"]) : "")
                - key: JUSTIFICATION
                  expression: >-
                    ("JUSTIFICATION" in extensions.commentMap) ? string(extensions.commentMap["JUSTIFICATION"]) : (("JUSTIFICATION" in extensions.issueMap) ? string(extensions.issueMap["JUSTIFICATION"]) : "")
                # SCM coordinates derived from the payload.
                - key: git_host
                  expression: >-
                    body.project.git_http_url.parseURL().host
                - key: base_branch
                  expression: >-
                    (has(body.project.default_branch) && body.project.default_branch != null) ? body.project.default_branch : "main"
                # The commented-on issue's project-scoped number (iid), as a string,
                # so the opened MR can link back to it. Falls back to "" if absent.
                - key: issue_iid
                  expression: >-
                    (has(body.issue) && has(body.issue.iid) && body.issue.iid != null) ? string(body.issue.iid) : ""
      bindings:
        - ref: cve-remediation-issue-binding
      template:
        ref: cve-remediation-issue-template
    - name: gitlab-issue-remediate-renovate
      interceptors:
        # 1) Validate the shared secret token and that this is a comment event.
        - ref:
            name: gitlab
          params:
            - name: secretRef
              value:
                secretName: gitlab-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value:
                - "Note Hook"
        # 2) Only act on issue comments beginning with /remediate-renovate.
        #
        # Two cel-interceptor gotchas shape the structure below:
        #
        #  (1) Overlays within a SINGLE cel interceptor do NOT chain -- they are all
        #      evaluated against the same starting extensions (empty), so an overlay
        #      cannot read an extension set by a sibling ("no such key"). Extensions
        #      only become visible to the NEXT interceptor. So the decision merge is
        #      split into three sequential cel interceptors by dependency:
        #        (a) raw text  ->  (b) parsed maps  ->  (c) merged fields.
        #
        #  (2) The overlay `key` is relative to the extensions root already, so it
        #      must be BARE (key: issueRaw), NOT prefixed (key: extensions.issueRaw).
        #      A prefixed key double-nests to extensions.extensions.issueRaw, which
        #      the next stage's `extensions.issueRaw` then can't find. Expressions
        #      and TriggerBinding refs, by contrast, DO use the extensions. prefix.
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.object_attributes.noteable_type == 'Issue' &&
                body.object_attributes.system == false &&
                body.object_attributes.note.matches('^/remediate-renovate(\\s|$)')
            - name: overlays
              value:
                # Raw decision text from the issue body's <!-- cve-decision ... --> marker.
                - key: issueRaw
                  expression: >-
                    (has(body.issue) && has(body.issue.description) && body.issue.description != null && size(body.issue.description.split("<!-- cve-decision")) > 1) ? body.issue.description.split("<!-- cve-decision")[1].split("-->")[0] : ""
                # Raw override text from the comment (everything after /remediate-renovate).
                - key: commentRaw
                  expression: >-
                    size(body.object_attributes.note.split("/remediate-renovate")) > 1 ? body.object_attributes.note.split("/remediate-renovate")[1] : ""
        # (b) Parse both raw blocks into maps (parseYAML also accepts JSON). Skip
        #     parsing when there's no "key: value" content, to avoid errors on empty
        #     text. Reads extensions.issueRaw / commentRaw from the previous stage.
        - ref:
            name: cel
          params:
            - name: overlays
              value:
                - key: issueMap
                  expression: >-
                    extensions.issueRaw.contains(":") ? extensions.issueRaw.parseYAML() : {}
                - key: commentMap
                  expression: >-
                    extensions.commentRaw.contains(":") ? extensions.commentRaw.parseYAML() : {}
        # (c) Merge each field (comment > issue > default) and derive SCM coordinates.
        #     Reads extensions.issueMap / commentMap from the previous stage.
        - ref:
            name: cel
          params:
            - name: overlays
              value:
                - key: SELECTED
                  expression: >-
                    ("SELECTED" in extensions.commentMap) ? string(extensions.commentMap["SELECTED"]) : (("SELECTED" in extensions.issueMap) ? string(extensions.issueMap["SELECTED"]) : "1")
                - key: CVE_ID
                  expression: >-
                    ("CVE_ID" in extensions.commentMap) ? string(extensions.commentMap["CVE_ID"]) : (("CVE_ID" in extensions.issueMap) ? string(extensions.issueMap["CVE_ID"]) : "")
                - key: PACKAGE
                  expression: >-
                    ("PACKAGE" in extensions.commentMap) ? string(extensions.commentMap["PACKAGE"]) : (("PACKAGE" in extensions.issueMap) ? string(extensions.issueMap["PACKAGE"]) : "")
                - key: CURRENT_VERSION
                  expression: >-
                    ("CURRENT_VERSION" in extensions.commentMap) ? string(extensions.commentMap["CURRENT_VERSION"]) : (("CURRENT_VERSION" in extensions.issueMap) ? string(extensions.issueMap["CURRENT_VERSION"]) : "")
                - key: FIXED_VERSION
                  expression: >-
                    ("FIXED_VERSION" in extensions.commentMap) ? string(extensions.commentMap["FIXED_VERSION"]) : (("FIXED_VERSION" in extensions.issueMap) ? string(extensions.issueMap["FIXED_VERSION"]) : "")
                - key: JUSTIFICATION
                  expression: >-
                    ("JUSTIFICATION" in extensions.commentMap) ? string(extensions.commentMap["JUSTIFICATION"]) : (("JUSTIFICATION" in extensions.issueMap) ? string(extensions.issueMap["JUSTIFICATION"]) : "")
                # SCM coordinates derived from the payload.
                - key: git_host
                  expression: >-
                    body.project.git_http_url.parseURL().host
                - key: base_branch
                  expression: >-
                    (has(body.project.default_branch) && body.project.default_branch != null) ? body.project.default_branch : "main"
                # The commented-on issue's project-scoped number (iid), as a string,
                # so the opened MR can link back to it. Falls back to "" if absent.
                - key: issue_iid
                  expression: >-
                    (has(body.issue) && has(body.issue.iid) && body.issue.iid != null) ? string(body.issue.iid) : ""
                - key: note_id
                  expression: string(body.object_attributes.id)
                - key: requester_id
                  expression: string(body.user.id)
                - key: project_id
                  expression: string(body.project.id)
      bindings:
        - ref: renovate-remediation-issue-binding
      template:
        ref: renovate-remediation-issue-template
    - name: gitlab-issue-generate-tests
      interceptors:
        # 1) Validate the shared secret token and that this is a comment event.
        - ref:
            name: gitlab
          params:
            - name: secretRef
              value:
                secretName: gitlab-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value:
                - "Note Hook"
        # 2) Only act on issue comments beginning with the /generate-tests
        #    command, and derive the SCM coordinates. Both overlays read only
        #    `body`, so ONE cel interceptor suffices -- unlike /remediate,
        #    nothing here depends on an extension set by a sibling overlay (see
        #    the chaining gotcha above). Overlay keys are BARE (key: git_host),
        #    not extensions.-prefixed.
        #
        #    The filter is WORD-BOUNDED, not a plain startsWith: the sibling
        #    commands /generate-tests-functional and /generate-tests-integration
        #    both also start with "/generate-tests", so a startsWith filter here
        #    would match them too and start TWO pipelines off one comment. The
        #    regex demands the command end at whitespace or end-of-string; its
        #    explicit ^/$ anchors make it behave identically whether the cel
        #    `matches` implementation is full-match or partial-match.
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.object_attributes.noteable_type == 'Issue' &&
                body.object_attributes.system == false &&
                body.object_attributes.note.matches('^/generate-tests(\s|$)')
            - name: overlays
              value:
                - key: git_host
                  expression: >-
                    body.project.git_http_url.parseURL().host
                - key: base_branch
                  expression: >-
                    (has(body.project.default_branch) && body.project.default_branch != null) ? body.project.default_branch : "main"
                # The commented-on issue's project-scoped number (iid), as a string,
                # so the opened MR can link back to it. Falls back to "" if absent.
                - key: issue_iid
                  expression: >-
                    (has(body.issue) && has(body.issue.iid) && body.issue.iid != null) ? string(body.issue.iid) : ""
      bindings:
        - ref: test-generation-issue-binding
      template:
        ref: test-generation-issue-template
    - name: gitlab-issue-generate-tests-functional
      interceptors:
        # 1) Validate the shared secret token and that this is a comment event.
        - ref:
            name: gitlab
          params:
            - name: secretRef
              value:
                secretName: gitlab-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value:
                - "Note Hook"
        # 2) Only act on issue comments beginning with /generate-tests-functional
        #    (longest-prefix command, so startsWith is unambiguous here), and
        #    derive the SCM coordinates. Same single-cel-interceptor structure
        #    as gitlab-issue-generate-tests above.
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.object_attributes.noteable_type == 'Issue' &&
                body.object_attributes.system == false &&
                body.object_attributes.note.startsWith('/generate-tests-functional')
            - name: overlays
              value:
                - key: git_host
                  expression: >-
                    body.project.git_http_url.parseURL().host
                - key: base_branch
                  expression: >-
                    (has(body.project.default_branch) && body.project.default_branch != null) ? body.project.default_branch : "main"
                # The commented-on issue's project-scoped number (iid), as a string,
                # so the opened MR can link back to it. Falls back to "" if absent.
                - key: issue_iid
                  expression: >-
                    (has(body.issue) && has(body.issue.iid) && body.issue.iid != null) ? string(body.issue.iid) : ""
      bindings:
        - ref: test-generation-issue-binding
      template:
        ref: test-generation-functional-issue-template
    - name: gitlab-issue-generate-tests-integration
      interceptors:
        # 1) Validate the shared secret token and that this is a comment event.
        - ref:
            name: gitlab
          params:
            - name: secretRef
              value:
                secretName: gitlab-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value:
                - "Note Hook"
        # 2) Only act on issue comments beginning with /generate-tests-integration
        #    (longest-prefix command, so startsWith is unambiguous here), and
        #    derive the SCM coordinates. Same single-cel-interceptor structure
        #    as gitlab-issue-generate-tests above.
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.object_attributes.noteable_type == 'Issue' &&
                body.object_attributes.system == false &&
                body.object_attributes.note.startsWith('/generate-tests-integration')
            - name: overlays
              value:
                - key: git_host
                  expression: >-
                    body.project.git_http_url.parseURL().host
                - key: base_branch
                  expression: >-
                    (has(body.project.default_branch) && body.project.default_branch != null) ? body.project.default_branch : "main"
                # The commented-on issue's project-scoped number (iid), as a string,
                # so the opened MR can link back to it. Falls back to "" if absent.
                - key: issue_iid
                  expression: >-
                    (has(body.issue) && has(body.issue.iid) && body.issue.iid != null) ? string(body.issue.iid) : ""
      bindings:
        - ref: test-generation-issue-binding
      template:
        ref: test-generation-integration-issue-template
---
# Expose the EventListener so GitLab can reach it. Point the GitLab webhook URL at
# this Route's https:// host. (OpenShift-specific; drop if you expose it another way.)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agentic-issue-commands
  labels:
    app.kubernetes.io/part-of: maven-build-ci
spec:
  to:
    kind: Service
    name: el-agentic-issue-commands
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
