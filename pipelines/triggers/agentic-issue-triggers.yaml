# =============================================================================
# Issue-comment triggers: start a pipeline by commenting a slash-command on a
# GitLab issue. One EventListener (one webhook / Route) hosts BOTH commands; each
# trigger's cel `filter` picks the command it handles, so a comment only starts the
# matching pipeline:
#
#   /remediate-renovate -> cve-remediation-renovate (Renovate + Maven verification)
#   /remediate       ->  agentic-cve-remediation   (reads a decision from the issue)
#   /generate-tests  ->  agentic-test-generation   (unit tests; no decision needed)
#   /generate-tests-functional   ->  agentic-test-generation-functional
#   /generate-tests-integration  ->  agentic-test-generation-integration
#
# Flow:  GitLab issue comment  ->  webhook (Note Hook)  ->  EventListener
#        ->  gitlab interceptor (validate X-Gitlab-Token, event type)
#        ->  cel interceptor (filter on the command [+ merge the decision])
#        ->  TriggerBinding (extensions/body -> params)
#        ->  TriggerTemplate (create the PipelineRun)
#
# ---- /remediate --------------------------------------------------------------
# The six-field decision (SELECTED / CVE_ID / PACKAGE / CURRENT_VERSION /
# FIXED_VERSION / JUSTIFICATION) is read from the ISSUE BODY, where it must sit
# inside an HTML-comment marker so it stays invisible in rendered markdown:
#
#     <!-- cve-decision
#     SELECTED: "1"
#     CVE_ID: CVE-2024-12345
#     PACKAGE: com.example:widget
#     CURRENT_VERSION: 1.2.3
#     FIXED_VERSION: 1.2.4
#     JUSTIFICATION: High-severity RCE with a clean single-dependency bump.
#     -->
#
# A commenter can OVERRIDE any of the six fields by putting YAML or JSON directly
# after the /remediate command (no code fences), e.g.:
#
#     /remediate
#     FIXED_VERSION: 1.2.5
#     JUSTIFICATION: bumping to the latest patch instead
#
#   ...or as JSON:  /remediate {"FIXED_VERSION": "1.2.5"}
#
# Comment values win over issue values; anything absent from both falls back to a
# default (SELECTED defaults to "1" since a human explicitly asked to remediate).
# If the merged SELECTED is "0", the pipeline clones and then no-ops (its tail is
# gated on SELECTED == "1").
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  labels:
    app.kubernetes.io/part-of: maven-build-ci
---
# Namespaced permissions the EventListener needs: read Trigger* resources and
# create PipelineRuns in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-eventlistener-binding
  labels:
    app.kubernetes.io/part-of: maven-build-ci
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
# Cluster-scoped permission the EventListener needs to reach ClusterInterceptors
# (gitlab, cel). NOTE: set the subject namespace to your pipeline namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-eventlistener-clusterbinding
  labels:
    app.kubernetes.io/part-of: maven-build-ci
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: tssc-app-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: cve-remediation-issue-binding
  labels:
    app.kubernetes.io/part-of: maven-build-ci
spec:
  params:
    # Repo + SCM coordinates come straight from the GitLab payload (git-host is
    # derived in the cel interceptor via parseURL).
    - name: git-url
      value: $(body.project.git_http_url)
    - name: git-host
      value: $(extensions.git_host)
    - name: base-branch
      value: $(extensions.base_branch)
    # The merged six-field decision (comment overrides issue; see cel overlays).
    - name: SELECTED
      value: $(extensions.SELECTED)
    - name: CVE_ID
      value: $(extensions.CVE_ID)
    - name: PACKAGE
      value: $(extensions.PACKAGE)
    - name: CURRENT_VERSION
      value: $(extensions.CURRENT_VERSION)
    - name: FIXED_VERSION
      value: $(extensions.FIXED_VERSION)
    - name: JUSTIFICATION
      value: $(extensions.JUSTIFICATION)
    # The commented-on issue's project-scoped number, so the opened MR can link
    # back to it (see the issue_iid overlay in the EventListener).
    - name: issue-iid
      value: $(extensions.issue_iid)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: cve-remediation-issue-template
  labels:
    app.kubernetes.io/part-of: maven-build-ci
spec:
  params:
    - name: git-url
    - name: git-host
    - name: base-branch
      default: main
    - name: scm-provider
      default: gitlab
    - name: subdirectory
      default: source
    - name: SELECTED
      default: "1"
    - name: CVE_ID
      default: ""
    - name: PACKAGE
      default: ""
    - name: CURRENT_VERSION
      default: ""
    - name: FIXED_VERSION
      default: ""
    - name: JUSTIFICATION
      default: ""
    - name: issue-iid
      default: ""
    # Workspace backing — override to match your cluster's storage/config.
    - name: workspace-size
      default: 2Gi
    - name: scm-secret-name
      default: scm-auth-secret
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: agentic-cve-remediation-issue-
        labels:
          app.kubernetes.io/part-of: maven-build-ci
          tekton.dev/pipeline: agentic-cve-remediation
          trigger: gitlab-issue
      spec:
        pipelineRef:
          name: agentic-cve-remediation
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-host
            value: $(tt.params.git-host)
          - name: base-branch
            value: $(tt.params.base-branch)
          - name: scm-provider
            value: $(tt.params.scm-provider)
          - name: subdirectory
            value: $(tt.params.subdirectory)
          - name: scm-secret-name
            value: $(tt.params.scm-secret-name)
          - name: SELECTED
            value: $(tt.params.SELECTED)
          - name: CVE_ID
            value: $(tt.params.CVE_ID)
          - name: PACKAGE
            value: $(tt.params.PACKAGE)
          - name: CURRENT_VERSION
            value: $(tt.params.CURRENT_VERSION)
          - name: FIXED_VERSION
            value: $(tt.params.FIXED_VERSION)
          - name: JUSTIFICATION
            value: $(tt.params.JUSTIFICATION)
          - name: issue-iid
            value: $(tt.params.issue-iid)
        workspaces:
          - name: workspace
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: $(tt.params.workspace-size)
          # maven-settings carries the settings.xml that routes ALL dependency
          # resolution through the Artifactory `maven` virtual repo. re-run-tests
          # runs `mvn verify` against the remediated tree, and the whole point of
          # the remediation is a backported coordinate that is NOT on Maven
          # Central -- so the build has to resolve through the mirror or it fails
          # to find the very version the agent just pinned. An emptyDir would let
          # the maven task generate a default settings.xml pointed at Central.
          #
          # A Secret, not a ConfigMap: Artifactory OSS has anonymous access off,
          # so the settings.xml embeds a <server> credential. The maven task's
          # generate step copies `<workspace>/settings.xml` verbatim when it is
          # present, which is exactly the Secret's single data key.
          #
          # The Secret MUST exist in this namespace before a trigger fires -- a
          # secret-backed workspace whose Secret is missing leaves the pod stuck
          # in PodInitializing forever (never errors, just hangs), the same trap
          # as a missing git-auth secret. Create it from
          # secrets/maven-settings-secret.example.yaml:
          #   oc -n tssc-app-ci create secret generic maven-settings \
          #     --from-file=settings.xml=./settings.xml
          - name: maven-settings
            secret:
              secretName: maven-settings
          # NOTE: git-auth (clone credentials) is intentionally NOT bound here.
          # It is optional on the pipeline, and a secret-backed workspace whose
          # secret is missing leaves the clone pod stuck in PodInitializing
          # forever (never an error, just hangs) -- there is no way to bind it
          # conditionally in a TriggerTemplate. For a PUBLIC app repo the clone
          # needs no auth, so we omit it. For a PRIVATE repo, create a basic-auth
          # Secret named `git-auth` and add it back:
          #   - name: git-auth
          #     secret:
          #       secretName: git-auth
---
# ---- /generate-tests ---------------------------------------------------------
# The test-generation commands carry no decision -- they only need the repo
# coordinates (git-url from the payload, git-host + base-branch derived in cel),
# so their bindings/templates are much simpler than the remediation pair above.
# All three (unit/functional/integration) share ONE TriggerBinding --
# test-generation-issue-binding -- because it extracts nothing command-specific;
# each command just gets its own TriggerTemplate (own PipelineRun shape) and its
# own EventListener trigger (own cel filter).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: test-generation-issue-binding
  labels:
    app.kubernetes.io/part-of: maven-build-ci
spec:
  params:
    - name: git-url
      value: $(body.project.git_http_url)
    - name: git-host
      value: $(extensions.git_host)
    - name: base-branch
      value: $(extensions.base_branch)
    # The commented-on issue's project-scoped number, so the opened MR can link
    # back to it (see the issue_iid overlay in the EventListener).
    - name: issue-iid
      value: $(extensions.issue_iid)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: test-generation-issue-template
  labels:
    app.kubernetes.io/part-of: maven-build-ci
spec:
  params:
    - name: git-url
    - name: git-host
    - name: base-branch
      default: main
    - name: scm-provider
      default: gitlab
    - name: subdirectory
      default: source
    - name: issue-iid
      default: ""
    # Workspace backing -- override to match your cluster's storage/config.
    - name: workspace-size
      default: 2Gi
    - name: scm-secret-name
      default: scm-auth-secret
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: agentic-test-generation-issue-
        labels:
          app.kubernetes.io/part-of: maven-build-ci
          tekton.dev/pipeline: agentic-test-generation
          trigger: gitlab-issue
      spec:
        pipelineRef:
          name: agentic-test-generation
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-host
            value: $(tt.params.git-host)
          - name: base-branch
            value: $(tt.params.base-branch)
          - name: scm-provider
            value: $(tt.params.scm-provider)
          - name: subdirectory
            value: $(tt.params.subdirectory)
          - name: scm-secret-name
            value: $(tt.params.scm-secret-name)
          - name: issue-iid
            value: $(tt.params.issue-iid)
        workspaces:
          - name: workspace
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: $(tt.params.workspace-size)
          # maven-settings carries the settings.xml that routes ALL dependency
          # resolution through the Artifactory `maven` virtual repo. Both
          # ai-generate-tests (the agent's own `mvn test` plus its scratch
          # verification build) and re-run-tests need it: once a remediation PR
          # has merged, the tree carries a Lightwell backport pin that does not
          # exist on Maven Central. See the remediation template above for the
          # full reasoning and the `oc create secret` command. The Secret MUST
          # exist in this namespace or the pod hangs in PodInitializing.
          - name: maven-settings
            secret:
              secretName: maven-settings
          # git-auth intentionally NOT bound -- same reasoning as the remediation
          # template above (optional workspace; a missing secret hangs the clone
          # pod). For a PRIVATE repo, create a `git-auth` Secret and add it back.
---
# ---- /generate-tests-functional ----------------------------------------------
# Same shape as test-generation-issue-template above, pointing at the functional
# pipeline. Shares test-generation-issue-binding (nothing command-specific in it).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: test-generation-functional-issue-template
  labels:
    app.kubernetes.io/part-of: maven-build-ci
spec:
  params:
    - name: git-url
    - name: git-host
    - name: base-branch
      default: main
    - name: scm-provider
      default: gitlab
    - name: subdirectory
      default: source
    - name: issue-iid
      default: ""
    # Workspace backing -- override to match your cluster's storage/config.
    - name: workspace-size
      default: 2Gi
    - name: scm-secret-name
      default: scm-auth-secret
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: agentic-test-generation-functional-issue-
        labels:
          app.kubernetes.io/part-of: maven-build-ci
          tekton.dev/pipeline: agentic-test-generation-functional
          trigger: gitlab-issue
      spec:
        pipelineRef:
          name: agentic-test-generation-functional
        # Pin the ephemeral-resource and K8s-API-touching tasks to the `pipeline`
        # service account: the deploy/reset/cleanup RBAC (Role
        # app-under-test-lifecycle + system:image-builder, in
        # tasks/deploy-app-under-test.yaml) is granted to it, and the generation
        # task's health-check/reset/log-fetch helpers authenticate with the task
        # pod's SA token. Pinning is deterministic: without taskRunSpecs the SA
        # comes from the PipelineRun's subject, which manual runs, the webhook,
        # and the console each set differently.
        #
        # This MUST live on the PipelineRun, not in the Pipeline definition:
        # taskRunSpecs is a PipelineRun-only field, and the API server silently
        # prunes it from Pipeline specs (sync "succeeds", Argo CD never
        # converges). The flattened v1 shape below -- serviceAccountName
        # directly under the entry, no taskServiceSpecs/taskPodTemplate nesting
        # -- is what this cluster's Tekton (OpenShift Pipelines 1.24.x, Tekton
        # v1.15) declares in its CRD. Pinning therefore applies to
        # webhook-started runs only; a manual or console run must set it on the
        # PipelineRun it creates.
        taskRunSpecs:
          - pipelineTaskName: deploy-app-under-test
            serviceAccountName: pipeline
          - pipelineTaskName: ai-generate-tests-functional
            serviceAccountName: pipeline
          - pipelineTaskName: reset-app-under-test
            serviceAccountName: pipeline
          - pipelineTaskName: cleanup-app-under-test
            serviceAccountName: pipeline
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-host
            value: $(tt.params.git-host)
          - name: base-branch
            value: $(tt.params.base-branch)
          - name: scm-provider
            value: $(tt.params.scm-provider)
          - name: subdirectory
            value: $(tt.params.subdirectory)
          - name: scm-secret-name
            value: $(tt.params.scm-secret-name)
          - name: issue-iid
            value: $(tt.params.issue-iid)
        workspaces:
          - name: workspace
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: $(tt.params.workspace-size)
          # maven-settings: the functional task's agent adds TEST-SCOPED deps
          # (REST Assured) that must resolve through the mirror, and it runs
          # Maven itself (app package + verification builds). Same reasoning
          # and same `oc create secret` command as the templates above. The
          # Secret MUST exist in this namespace or the pod hangs in
          # PodInitializing.
          - name: maven-settings
            secret:
              secretName: maven-settings
          # git-auth intentionally NOT bound -- same reasoning as the remediation
          # template above (optional workspace; a missing secret hangs the clone
          # pod). For a PRIVATE repo, create a `git-auth` Secret and add it back.
---
# ---- /generate-tests-integration ---------------------------------------------
# Same shape as test-generation-issue-template above, pointing at the integration
# pipeline. Shares test-generation-issue-binding (nothing command-specific in it).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: test-generation-integration-issue-template
  labels:
